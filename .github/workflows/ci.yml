name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  shots:
    name: shots
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 50); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 0.2
          done

      - name: Take the pictures
        timeout-minutes: 5
        env:
          DEBUG: pw:browser
        run: npm run shot:ci

      - name: Compare with the baselines
        run: npm run shot:compare

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: |
            shots/ci
            shots/diff
          if-no-files-found: ignore
