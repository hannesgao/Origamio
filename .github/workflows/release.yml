name: release

# Runs when a GitHub Release is published (or by hand for an existing tag):
# checks that the tag matches package.json, builds from the tag, and attaches
# the built site as a zip to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Zip the site
        run: |
          cp LICENSE README.md README.zh-CN.md dist/
          (cd dist && zip -qr "../origamio-${TAG#v}.zip" .)
          unzip -l "origamio-${TAG#v}.zip"

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "origamio-${TAG#v}.zip" --clobber --repo "$GITHUB_REPOSITORY"
